name: security-weekly
on:
  schedule: [{ cron: "17 5 * * 1" }]
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit bandit
      - run: pip-audit -r requirements/runtime.txt --require-hashes --disable-pip
      - run: bandit -r src -ll
