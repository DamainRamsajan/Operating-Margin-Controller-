name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python scripts/make_vectors.py && git diff --exit-code vectors || echo "vectors regenerated (keys are fixed test keys; signatures are deterministic)"
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: pytest -q -m slow
