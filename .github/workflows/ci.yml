name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/dev.txt && pip install --no-deps -e .
      - run: python scripts/make_vectors.py
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: pytest -q -m slow
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install bandit pip-audit cyclonedx-bom
      - run: bandit -r src -ll
      - run: pip-audit -r requirements/runtime.txt --require-hashes --disable-pip
      - run: cyclonedx-py requirements requirements/runtime.txt --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cdx.json }
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t omc:ci .
      - run: docker run --rm --entrypoint omc omc:ci --help
