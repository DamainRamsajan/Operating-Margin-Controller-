[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omc"
version = "0.1.0"
description = "Operating-Margin Controller: certified model qualification, evidence statements and audits (milestone M0)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "cbor2>=5.6", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
spike = ["scikit-learn>=1.4"]

[project.scripts]
omc = "omc.cli:main"
omc-verify = "omc_verify.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: statistical simulations (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E701", "E702", "B905"]
